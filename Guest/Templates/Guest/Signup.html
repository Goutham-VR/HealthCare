{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/e48d166edc.js"
      crossorigin="anonymous"
    ></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap");

      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        font-family: "Poppins", sans-serif;
        font-weight: 400;
      }
      .Main-container {
        width: 100%;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      /* .container-login{
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background: #9053c7;
    background: linear-gradient(-135deg, #c850c0, #4158d0);
} */
      .wrap-login {
        width: 960px;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
  /*      flex-wrap: wrap; */
        justify-content: space-between; 
    /*    padding: 177px 130px 33px 95px; */
      }
      .login-pic {
        padding-top: 20%;
        width: 316px;
      }
      .login-pic img {
        max-width: 100%;
      }
      .login-form {
        width: 290px;
      }
      .login-form-title {
        font-family: "poppins", sans-serif;
        font-size: 24px;
        color: #333333;
        line-height: 1.2;
        text-align: center;
        font-weight: 700;
        width: 100%;
        display: block;
        padding-bottom: 54px;
      }
      .wrap-input {
        position: relative;
        width: 100%;
        z-index: 1;
        margin-bottom: 10px;
      }
      .input {
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.5;
        color: #666666;
        outline: none;
        border: none;
        display: block;
        width: 100%;
        background: #e6e6e6;
        height: 50px;
        border-radius: 25px;
        padding: 0 30px 0 68px;
      }
      .focus-input {
        display: block;
        position: absolute;
        border-radius: 25px;
        bottom: 0;
        left: 0;
        z-index: -1;
        width: 100%;
        height: 100%;
        box-shadow: 0px 0px 0px 0px;
        color: rgba(87, 184, 70, 0.8);
      }
      .input:focus + .focus-input {
        animation: anim-shadow 0.5s ease-in-out forwards;
      }
      @-webkit-keyframes anim-shadow {
        to {
          box-shadow: 0px 0px 70px 25px;
          opacity: 0;
        }
      }
      @keyframes anim-shadow {
        to {
          box-shadow: 0px 0px 70px 25px;
          opacity: 0;
        }
      }

      .symbol-input {
        font-size: 15px;
        display: flex;
        align-items: center;
        position: absolute;
        border-radius: 25px;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding-left: 35px;
        pointer-events: none;
        color: #666666;
        transition: all 0.4s;
      }
      .input:focus + .focus-input + .symbol-input {
        color: #57b846;
        padding-left: 28px;
      }

      .login-form-btn-container {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding-top: 20px;
      }
      .login-form-btn {
        font-family: "poppins", sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: #fff;
        background: #57b846;
        text-transform: uppercase;
        width: 100%;
        height: 50px;
        border-radius: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 25px;
        transition: all 0.4s;
        border: none;
      }
      .login-form-btn:hover {
        background: #333333;
      }
      .text-center {
        text-align: center;
      }
      .txt1 {
        font-family: "poppins";
        font-size: 13px;
        line-height: 1.5;
        color: #666666;
      }
      .txt2 {
        font-family: "poppins";
        font-size: 13px;
        line-height: 1.5;
        color: #666666;
      }
      .p-t-1 {
        padding-top: 12px;
      }
      .p-t-2 {
        padding-top: 56px;
      }

      a {
        font-family: "poppins", sans-serif;
        font-size: 14px;
        line-height: 1.7;
        color: #666666;
        margin: 0px;
        transition: all 0.4s;
        text-decoration: none;
        font-weight: 400;
      }
      a:focus {
        outline: none !important;
      }
      a:hover {
        color: #57b846;
      }
      button {
        outline: none !important;
        border: none;
        background: transparent;
      }
      button:hover {
        cursor: pointer;
      }

      /* Responsive */
      @media (max-width: 992px) {
        .wrap-login {
          padding: 177px 90px 33px 85px;
        }

        .login-pic {
          width: 35%;
        }
        .login-form {
          width: 50%;
        }
      }

      @media (max-width: 768px) {
        .wrap-login {
          padding: 100px 80px 33px 80px;
        }

        .login-pic {
          display: none;
        }
        .login-form {
          width: 100%;
        }
      }

      @media (max-width: 576px) {
        .wrap-login {
          padding: 100px 15px 33px 15px;
        }
      }
      .custom-file-label {
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        font-weight: 500;
        line-height: 3.5;
        color: #666666;
        outline: none;
        border: none;
        display: block;
        width: 100%;
        background: #e6e6e6;
        height: 50px;
        border-radius: 25px;
        padding: 0 30px 0 68px;
      }

      /* Hover or active states, if desired */
      .custom-file-label:hover {
        background: #eee;
      }
    </style>

    <!-- <link rel="stylesheet" href="{%static 'Main/Loginstyles.css' %}" /> -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">

    <title>SignUp Form</title>
  </head>

  <body>
    
    <!-- Navbar -->
    <nav class="bg-gray shadow-lg">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center py-4">
          <div class="flex items-center">
            <svg
              class="h-8 w-8 text-blue-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              />
            </svg>
            <span class="ml-2 text-xl font-semibold">Healthcare Assistant</span>
          </div>
          <div class="flex items-center space-x-4">
            <a href="#home" class="text-gray-700">Home</a>
            <a href="#about" class="text-gray-700">About</a>
            <a href="#bmi" class="text-gray-700">BMI</a>
            <a href="{% url 'Guest:login' %}"><button
              class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
            >
              Login
            </button></a>
          </div>
        </div>
      </div>
    </nav>

    <div class="Main-container">
      <div class="container-login">
      <div class="wrap-login">
        <div class="login-pic">
          <img src="{%static 'Main/img.png' %}" alt="IMG" />
        </div>

        <form class="login-form" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          <span class="login-form-title">SIGN UP</span>

          <div class="wrap-input">
            <input
              type="text"
              class="input"
              name="name"
              placeholder="Name"
              required
            />
            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa solid fa-user" aria-hidden="true"></i>
            </span>
          </div>

          <div class="wrap-input">
            <input
              type="text"
              class="input"
              name="email"
              placeholder="Email"
              required
            />
            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa fa-envelope" aria-hidden="true"></i>
            </span>
          </div>

          <div class="wrap-input">
            <input
              type="text"
              class="input"
              name="contact"
              placeholder="Contact"
              required
            />
            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa solid fa-address-book" aria-hidden="true"></i>
            </span>
          </div>

          <div class="wrap-input">
            <input
              type="text"
              class="input"
              name="address"
              placeholder="Address"
              required
            />
            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa fa-address-card" aria-hidden="true"></i>
            </span>
          </div>

          <div class="wrap-input">
            <!-- Hidden file input -->
            <input type="file" id="fileUpload" name="file" required hidden />

            <!-- Label that looks like an input/button -->
            <label for="fileUpload" class="custom-file-label">
              Add Photo
            </label>

            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa fa-id-badge" aria-hidden="true"></i>
            </span>
          </div>

          <div class="wrap-input">
            <select class="input" name="seldistrict" id="seldistrict" placeholder="District">
              <option value="">Select District</option>
              {%for i in dis%}
              <option value="{{i.id}}">{{i.district_name}}</option>
              {%endfor%}
            </select>
            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            </span>
          </div>

          <div class="wrap-input">
            <select class="input" name="selplace" id="selplace" placeholder="District">
              <option value="">Select Place</option>
            </select>
            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa-solid fa-location-pin" aria-hidden="true"></i>
            </span>
          </div>

          <div class="wrap-input">
            <input
              type="password"
              class="input"
              name="pass"
              placeholder="Password"
              required
            />
            <span class="focus-input"></span>
            <span class="symbol-input">
              <i class="fa fa-lock" aria-hidden="true"></i>
            </span>
          </div>

          <div class="login-form-btn-container">
            <input type="submit" class="login-form-btn" value="Register" />
          </div>

          <!-- <div class="text-center p-t-1">
            <span class="txt1">Forgot</span>
            <a href="#" class="txt2"> Username / Password ?</a>
          </div> -->

          <div class="text-center p-t-2">
            Already Registered?
            <a href="{% url 'Guest:login' %}" class="txt2"> Login Here ></a>
          </div>
        </form>
      </div>
      
    </div>
  </body>
</html>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
  $("#seldistrict").change(function () {
    var did = $(this).val();
    var ur = "{% url 'Guest:ajaxplace' %}";
    $.ajax({
      url: ur,
      data: { did: did },
      success: function (data) {
        $("#selplace").html(data);
      },
    });
  });
</script>
