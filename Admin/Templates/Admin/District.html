<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>District</title>
  </head>
  <body>
    <form action="" method="post">
      {% csrf_token %}
      <table align="center" border="2">
        <tr>
          <td>District</td>
          <td><input type="text" name="txt_district" id=""  value="{{data.district_name}}"/></td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Submit" />
          </td>
        </tr>
      </table>
      <br />
      <table align="center" border="2">
        <tr>
          <td>SL NO</td>
          <td>Name</td>
          <td>Action</td>
        </tr>
        {% for i in dis %}
        <tr>
          <td>{{forloop.counter}}</td>
          <td>{{i.district_name}}</td>
          <td><a href="{% url 'Admin:deletedis' i.id %}">Delete</a>
              <a href="{% url 'Admin:editdis' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}
      </table>
    </form>
  </body>
</html>
