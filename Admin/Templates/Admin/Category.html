<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Category</title>
  </head>
  <body>
    <form action="" method="post">
      {% csrf_token %}
      <table align="center" border="2">
        <tr>
          <td>Category</td>
          <td><input type="text" name="txt_category" id="" value="{{data.category_name}}"/></td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Submit" />
          </td>
        </tr>
      </table><br>
      <table align="center" border="2">
        <tr>
          <td>SL NO</td>
          <td>Name</td>
          <td>Action</td>
        </tr>
        {% for i in cat %}
        <tr>
          <td>{{forloop.counter}}</td>
          <td>{{i.category_name}}</td>
          <td><a href="{% url 'Admin:deletecat' i.id %}">Delete</a>
              <a href="{% url 'Admin:editcat' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}
      </table>
    </form>
  </body>
</html>
