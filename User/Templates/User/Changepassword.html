<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body>
    <form action="" method="POST">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <tr>
                    <td>Current password</td>
                    <td><input type="password" name="curpass" id=""></td>
                </tr>
                <tr>
                    <td>New password</td>
                    <td><input type="pass" name="newpass" id=""></td>
                </tr>
                <tr>
                    <td>Confirm password</td>
                    <td><input type="text" name="confpass" id=""></td>
                </tr>
               
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" value="Update"></td></tr>
        </table>
    </form>
</body>
</html>

{%if msg%}
<script>
    alert("{{msg}}")
    window.location="{% url 'User:changepassword' %}"
</script>
{%endif%}
