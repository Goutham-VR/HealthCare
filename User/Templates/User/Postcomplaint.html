<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Complaint</title>
  </head>
  <body>
    <h1 align="center">Post Complaint</h1>
    <br />
    <form action="" method="post">
      {% csrf_token %}
      <table align="center" border="2">
        <tr>
          <td>Subject</td>
          <td><input type="text" name="subject" id="" /></td>
        </tr>
        <tr>
          <td>Complaint</td>
          <td>
            <textarea name="complaint" id="" cols="30" rows="7"></textarea>
          </td>
        </tr>
        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Submit" />
            <input type="reset" value="Cancel" />
          </td>
        </tr>
      </table>
      <br /><br />
    </form>
  </body>
</html>
{% if msg %}
<script>
  alert("{{msg}}");
  window.location = "{% url 'User:complaint' %}";
</script>
{% endif%}
