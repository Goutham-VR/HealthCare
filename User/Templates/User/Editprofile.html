<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>
<body>
    <form action="" method="POST">
        {% csrf_token %}
        <table border="2" align="center">
            <tr>
                <tr>
                    <td>Name</td>
                    <td><input type="text" name="name" id="" value="{{data.user_name}}"></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input type="text" name="email" id="" value="{{data.user_email}}"></td>
                </tr>
                <tr>
                    <td>Contact</td>
                    <td><input type="text" name="contact" id="" value="{{data.user_contact}}"></td>
                </tr>
                <tr>
                    <td>Address</td>
                    <td><input type="text" name="address" id="" value="{{data.user_address}}"></td>
                </tr>
            </tr>
            <tr align="center">
                <td colspan="2"><input type="submit" value="Submit"></td></tr>
        </table>
    </form>
</body>
</html>
