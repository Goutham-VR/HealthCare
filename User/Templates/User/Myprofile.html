<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
  </head>
  <body>
    <form action="" method="POST">
      {% csrf_token %}
      <table border="2" align="center">
        <tr>
          <td align="center" colspan="2">
            <img src="{{data.user_photo.url}}" width="200px" alt="" />
          </td>
        </tr>
        <tr>
          <td>Name</td>
          <td>{{data.user_name}}</td>
        </tr>
        <tr>
          <td>Email</td>
          <td>{{data.user_email}}</td>
        </tr>
        <tr>
          <td>Contact</td>
          <td>{{data.user_contact}}</td>
        </tr>
        <tr>
          <td>Address</td>
          <td>{{data.user_address}}</td>
        </tr>

        <tr>
          <td colspan="2" align="center">
            <a href="{% url 'User:editprofile' %}" style="text-decoration: none"
              >Editprofile</a
            >
            &MediumSpace;
            <a
              href="{% url 'User:changepassword' %}"
              style="text-decoration: none"
              >Changepassword</a
            >
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
